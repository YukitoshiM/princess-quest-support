name: Princess Quest support
description: Report a problem without including a child's personal information.
title: "[Support] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a child's legal name, photos, address, school, or other personal information.
        お子さまの本名、写真、住所、学校名などの個人情報を書かないでください。
  - type: dropdown
    id: language
    attributes:
      label: Language / 言語
      options:
        - 日本語
        - English
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version / iPhone機種とiOS
      placeholder: iPhone 15, iOS 26.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 困っていること
      description: Describe the screen, action, expected result, and actual result. Do not include child data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: "1. Open ...\n2. Tap ...\n3. ..."
